<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#14508C">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Ekstruzja</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314508C'/%3E%3Crect x='8' y='29' width='48' height='6' rx='3' fill='%23fff'/%3E%3Crect x='19' y='20' width='26' height='24' rx='3' fill='%23D4890B'/%3E%3C/svg%3E">
<style>
  :root{--steel:#E5E9ED;--panel:#FFF;--ink:#111820;--dim:#5B6B7B;--blue:#14508C;--blue-d:#0E3C6B;
    --amber:#D4890B;--amber-bg:#FDF3E0;--edge:#C9D2DA;--ok:#27724A;--ok-bg:#E9F4EE;
    --bad:#B3261E;--bad-bg:#FBECEB;--r:10px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--steel);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  :focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .bar{position:sticky;top:0;z-index:40;background:var(--blue);color:#fff;display:flex;align-items:center;gap:6px;
    padding:calc(10px + env(safe-area-inset-top)) 10px 10px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .burger{width:42px;height:42px;display:grid;place-items:center;border-radius:8px;flex:0 0 auto}
  .burger:active{background:var(--blue-d)}
  .burger span{display:block;width:20px;height:2px;background:#fff;box-shadow:0 -6px 0 #fff,0 6px 0 #fff}
  .ttl{flex:1;min-width:0}
  .ttl b{font-size:1.05rem;font-weight:650;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ttl small{display:block;font-size:.7rem;font-weight:400;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lang{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:8px;overflow:hidden;flex:0 0 auto}
  .lang button{padding:7px 10px;font-size:.78rem;font-weight:600;color:#fff;opacity:.65}
  .lang button[aria-pressed="true"]{background:#fff;color:var(--blue);opacity:1}
  .scrim{position:fixed;inset:0;background:rgba(10,20,30,.5);opacity:0;pointer-events:none;transition:opacity .18s;z-index:50}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:min(86vw,330px);z-index:60;background:var(--panel);
    transform:translateX(-102%);transition:transform .2s ease-out;display:flex;flex-direction:column;box-shadow:2px 0 14px rgba(10,20,30,.3)}
  .drawer.on{transform:none}
  .drawer header{background:var(--blue);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
  .drawer header b{font-size:1.1rem;display:block}
  .drawer header span{font-size:.75rem;opacity:.75}
  .dlist{overflow:auto;padding:0 0 20px;flex:1}
  .grp{font-size:.72rem;color:var(--dim);padding:14px 16px 4px;font-weight:700;letter-spacing:.4px}
  .ln{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid #EEF1F4}
  .ln:active{background:#F2F5F8}
  .ln i{width:4px;height:30px;border-radius:2px;background:var(--edge);flex:0 0 auto}
  .ln[data-g="PA"] i{background:var(--blue)} .ln[data-g="PP"] i{background:var(--ok)}
  .ln[data-g="X"] i{background:var(--amber)}
  .ln div{flex:1;min-width:0}
  .ln b{font-weight:600;font-size:.98rem;display:block}
  .ln em{font-style:normal;font-size:.76rem;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ln[aria-current="true"]{background:#EDF3FA} .ln[aria-current="true"] b{color:var(--blue)}
  main{padding:12px 12px 34px;max-width:640px;margin:0 auto}
  section{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);margin-bottom:12px}
  section>h2{font-size:.8rem;font-weight:700;color:var(--dim);margin:0;padding:11px 14px 0}
  .pad{padding:10px 14px 14px}
  .doff{border-left:6px solid var(--amber)} .doff.late{border-left-color:var(--bad)} .doff.stop{border-left-color:var(--dim)}
  .status{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #EDF0F3}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--ok);flex:0 0 auto;box-shadow:0 0 0 4px var(--ok-bg)}
  .dot.off{background:var(--bad);box-shadow:0 0 0 4px var(--bad-bg)}
  .status b{flex:1;font-size:.95rem}
  .status b em{display:block;font-style:normal;font-size:.76rem;color:var(--dim);font-weight:400}
  .tgl{padding:10px 14px;border-radius:8px;border:1px solid var(--edge);font-size:.85rem;font-weight:650;color:var(--blue);background:#fff;flex:0 0 auto}
  .tgl:active{background:#EDF3FA} .tgl.back{background:var(--ok);border-color:var(--ok);color:#fff}
  .clock{font-size:clamp(2.7rem,15vw,3.6rem);font-weight:700;line-height:1;letter-spacing:-1px;margin:6px 0 2px}
  .doff.late .clock{color:var(--bad)} .doff.soon .clock{color:var(--amber)}
  .sub{font-size:.9rem;color:var(--dim)} .sub b{color:var(--ink);font-weight:650}
  .btn{display:block;width:100%;margin-top:12px;padding:14px;border-radius:8px;background:var(--amber);color:#fff;font-weight:650}
  .btn:active{background:#B8760A}
  .btn.ghost{background:none;border:1px solid var(--edge);color:var(--dim);font-weight:600;font-size:.88rem;padding:11px}
  .btn.ghost:active{background:#F2F5F8}
  .btn.blue{background:var(--blue)} .btn.blue:active{background:var(--blue-d)}
  .rows{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline}
  .rows>div{padding:8px 0;border-bottom:1px solid #EDF0F3;font-size:.92rem;color:var(--dim)}
  .rows>div:nth-child(2n){text-align:right;color:var(--ink);font-weight:650;font-size:1rem}
  .rows>div:nth-last-child(-n+2){border-bottom:0}
  .big{font-size:1.3rem !important;font-weight:700 !important}
  .prog{height:8px;background:#E3E8ED;border-radius:4px;overflow:hidden;margin:10px 0 6px}
  .prog i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .4s}
  .prog.amber i{background:var(--amber)}
  .flag{border-radius:8px;padding:10px 12px;font-size:.92rem;font-weight:600;margin:10px 0 2px}
  .flag.ok{background:var(--ok-bg);color:var(--ok)} .flag.bad{background:var(--bad-bg);color:var(--bad)}
  .flag.warn{background:var(--amber-bg);color:#8A5A06} .flag.n{background:#F1F4F6;color:var(--dim);font-weight:500}
  .cnt{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #EDF0F3}
  .tag{width:44px;height:34px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:0 0 auto;border:1px solid}
  .tag.a1{background:#EDF3FA;border-color:#B9D0E8;color:var(--blue)}
  .tag.a2{background:#F1F4F6;border-color:var(--edge);color:var(--dim)}
  .tag.b{background:var(--amber-bg);border-color:#E8C98C;color:#8A5A06}
  .cnt .pc{flex:1;font-size:.8rem;color:var(--dim)}
  .cnt .v{width:52px;text-align:center;font-size:1.35rem;font-weight:700}
  .poz{margin:10px 0 2px}
  .poz>span{display:block;font-size:.8rem;color:var(--dim);margin-bottom:6px}
  .pozRow{display:flex;flex-wrap:wrap;gap:6px}
  .pz{width:40px;height:40px;border:1px solid var(--edge);border-radius:8px;background:#fff;
      font-weight:650;font-size:.95rem;color:var(--dim)}
  .pz:active{background:#F2F5F8}
  .pz.zr{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .pz.zrOld{background:#F6EAE9;border-color:#E0BDBA;color:#8A4642}
  .pz.wl{background:var(--amber-bg);border-color:var(--amber);color:#8A5A06}
  .pz.br{background:#F1EDF6;border-color:#8E77B5;color:#5B4780}
  .pz.dim{opacity:.3}
  .step{width:44px;height:40px;border:1px solid var(--edge);border-radius:8px;font-size:1.3rem;color:var(--blue);background:#fff;display:grid;place-items:center;flex:0 0 auto}
  .step:active{background:#EDF3FA}
  label{display:block;margin-bottom:12px}
  label span{display:block;font-size:.8rem;color:var(--dim);margin-bottom:4px}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--edge);border-radius:8px;background:#FBFCFD;font-size:1rem}
  input:focus,select:focus{border-color:var(--blue);background:#fff}
  input[readonly]{background:#F1F4F6;color:var(--dim)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .hint{font-size:.78rem;color:var(--dim);margin:-6px 0 12px}
  .hint.warn{color:#8A5A06;background:var(--amber-bg);padding:8px 10px;border-radius:6px;margin:-4px 0 12px}
  details summary{padding:11px 14px;font-size:.8rem;font-weight:700;color:var(--dim);list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"+";float:right;font-size:1.1rem;color:var(--blue)}
  details[open] summary::after{content:"–"}
  .log{font-size:.85rem;color:var(--dim);padding:6px 0;border-bottom:1px solid #EDF0F3;display:flex;justify-content:space-between}
  .mcard{border-bottom:1px solid #EDF0F3;padding:12px 14px}
  .mcard:last-child{border-bottom:0}
  .mhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .mhead b{font-size:.95rem;flex:1}
  .mhead em{font-style:normal;font-size:.76rem;color:var(--dim);text-align:right}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .rapWrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0 4px}
  table.rap{border-collapse:collapse;font-size:.76rem;min-width:600px}
  table.rap th,table.rap td{border:1px solid var(--edge);padding:5px 6px;text-align:center;white-space:nowrap}
  table.rap th{background:#F1F4F6;font-weight:700;color:var(--dim);font-size:.72rem}
  table.rap td.l{text-align:left;white-space:normal;min-width:130px;font-size:.72rem}
  table.rap tr.sum td{font-weight:700;background:#F8FAFB}
  table.rap td.h{font-weight:700;background:#FBFCFD}
  .four .gcol input{padding:10px 2px;font-size:.95rem}
  .tag.c{background:#F1EDF6;border-color:#CFC2E0;color:#5B4780}
  .gcol{text-align:center}
  .gcol .tag{width:100%;margin-bottom:6px}
  .gcol input{text-align:center;padding:10px 4px;font-weight:650}
  .foot{text-align:center;font-size:.75rem;color:var(--dim);padding:4px 0 10px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:80;background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:22px;font-size:.88rem;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="bar">
  <button class="burger" id="open" aria-label="Menu"><span></span></button>
  <div class="ttl"><b id="hLine"></b><small id="hSub"></small></div>
  <div class="lang"><button data-l="pl" aria-pressed="true">PL</button><button data-l="en" aria-pressed="false">EN</button></div>
</div>
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer"><header><b>Ekstruzja</b><span id="dSub"></span></header>
  <div style="padding:10px 12px;border-bottom:1px solid #EEF1F4">
    <div style="font-size:.72rem;color:var(--dim);font-weight:700;margin-bottom:6px" id="t_roleT"></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
      <button class="tgl" id="roleGora" style="padding:9px 2px;font-size:.78rem"></button>
      <button class="tgl" id="roleDol"  style="padding:9px 2px;font-size:.78rem"></button>
      <button class="tgl" id="roleOff"  style="padding:9px 2px;font-size:.78rem"></button>
    </div>
    <div class="hint" id="roleNote" style="margin:8px 0 0"></div>
  </div>
  <div class="dlist" id="dlist"></div></nav>

<main>
<div id="viewLine">
  <section id="ordHeadCard">
    <h2 id="t_ordHead"></h2>
    <div class="pad">
      <div id="ordHeadTop" style="font-size:1.05rem;font-weight:650"></div>
      <div class="hint" id="ordHeadIdx" style="margin:2px 0 8px"></div>
      <div class="prog amber"><i id="pOrdTop" style="width:0"></i></div>
      <div class="rows">
        <div id="t_ohDone"></div><div class="num" id="vOhDone">–</div>
        <div id="t_ohLeft"></div><div class="num" id="vOhLeft">–</div>
        <div id="t_ohRate"></div><div class="num" id="vOhRate">–</div>
        <div id="t_ohEnd"></div><div class="num big" id="vOhEnd">–</div>
      </div>
      <div class="flag n" id="ohFlag"></div>
    </div>
  </section>
  <section>
    <details id="cfgDet">
      <summary id="t_cfgT"></summary>
      <div class="pad">
        <div class="two">
          <label><span id="t_onr"></span><input id="oNr" inputmode="numeric" placeholder="872600213"></label>
          <label><span id="t_olot"></span><input id="oLot" placeholder="E1007P"></label>
        </div>
        <label><span id="t_oidx"></span><input id="oIdx" placeholder="POY-PP-…"></label>
        <div class="two">
          <label><span id="t_okg"></span><input id="oKg" type="number" inputmode="decimal" min="0" placeholder="1600"></label>
          <label><span id="t_okgh"></span><input id="oKgh" type="number" inputmode="decimal" min="0" placeholder="17,7"></label>
        </div>
        <label id="pairBox" hidden><span id="t_pair"></span>
          <select id="oPair"><option value="1"></option><option value="0"></option></select></label>
        <div class="hint" id="pairNote"></div>
        <div class="two">
          <label><span id="t_ost"></span><input id="oSt" type="datetime-local"></label>
          <label><span id="t_odl"></span><input id="oDl" type="datetime-local"></label>
        </div>
        <div class="two">
          <label><span id="t_ospd"></span><input id="oSpd" type="number" inputmode="decimal" min="0" placeholder="2052"></label>
          <label><span id="t_kgnet"></span><input id="sKg" type="number" inputmode="decimal" min="0.1" step="0.1"></label>
        </div>
        <div class="two">
          <label><span id="t_progA1"></span><input id="sProg" type="number" inputmode="decimal" min="0.1" step="0.1"></label>
          <label><span id="t_progInfo"></span><input id="sProgInfo" readonly></label>
        </div>
        <div class="hint" id="progHint" style="margin:-6px 0 12px"></div>
        <div class="hint" id="spdNote"></div>
        <div class="hint warn" id="t_kghint"></div>

        <div id="t_cycT" style="font-size:.8rem;font-weight:700;color:var(--ink);margin:4px 0 6px"></div>
        <div class="three">
          <label><span id="t_cycEl"></span><input id="cEl" type="number" inputmode="numeric" min="0"></label>
          <label><span id="t_cycLeft"></span><input id="cLeft" type="number" inputmode="numeric" min="0"></label>
          <label><span id="t_cycTot"></span><input id="cTot" type="number" inputmode="numeric" min="0"></label>
        </div>
        <button class="btn ghost" id="btnCyc" style="margin-top:0"></button>
        <div class="hint" id="cycNote" style="margin:8px 0 12px"></div>

        <div class="two">
          <label><span id="t_pos"></span><input id="sPos" readonly></label>
          <label><span id="t_palN"></span><input id="sPalN" readonly></label>
        </div>
        <label><span id="t_opNr"></span><input id="opNr" inputmode="numeric" placeholder="276"></label>
        <label><span id="t_sh1"></span><select id="sShift"><option value="6">06:00</option><option value="7">07:00</option><option value="8">08:00</option><option value="5">05:00</option></select></label>

        <button class="btn ghost" id="btnScan" style="margin-top:0"></button>
        <input id="scanFile" type="file" accept="image/*" capture="environment" hidden>
        <div class="hint" id="scanNote" style="margin:8px 0 12px"></div>

        <div class="rows" style="margin-bottom:10px">
          <div id="t_dbT"></div><div class="num" id="vDb">–</div>
          <div id="t_dbUse"></div><div class="num" id="vDbUse">–</div>
        </div>
        <div id="t_zycieT" style="font-size:.8rem;font-weight:700;color:var(--ink);margin:4px 0 8px"></div>
        <button class="btn ghost" id="btnStart" style="margin-top:0"></button>
        <button class="btn ghost" id="btnAlready" style="margin-top:8px"></button>
        <button class="btn ghost" id="btnKoniec" style="margin-top:8px"></button>
        <div class="hint" id="zycieNote" style="margin:8px 0 14px"></div>

        <div id="logBox"></div>
        <button class="btn ghost" id="btnClearLog" style="margin-top:12px"></button>
        <button class="btn ghost" id="btnExport" style="margin-top:8px"></button>
        <button class="btn ghost" id="btnImport" style="margin-top:8px"></button>
      </div>
    </details>
  </section>

  <section class="doff" id="doffCard">
    <h2 id="t_doff"></h2>
    <div class="status"><i class="dot" id="dot"></i><b id="stText"></b></div>
    <div id="stBtns" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 12px">
      <button class="tgl back" id="btnResume" style="grid-column:1/-1" hidden></button>
      <button class="tgl" id="btnStop"></button>
      <button class="tgl" id="btnAwaria"></button>
    </div>
    <div class="pad">
      <div class="clock num" id="cd">--:--:--</div>
      <div class="sub num" id="doffInfo">&nbsp;</div>
      <div class="cnt" style="border-bottom:0;padding:6px 0 0">
        <div class="pc" id="t_tAdj"></div>
        <button class="step" id="tMinus" aria-label="-1">−</button>
        <div class="v num" id="vTAdj">0</div>
        <button class="step" id="tPlus" aria-label="+1">+</button>
      </div>
      <div class="flag n" id="obcFlag" hidden></div>
      <div class="flag n" id="palNextFlag" hidden></div>
      <div style="display:grid;grid-template-columns:104px 1fr;gap:8px;margin-top:12px">
        <input id="doffAt" type="text" inputmode="numeric" maxlength="5" autocomplete="off"
               style="text-align:center" placeholder="teraz">
        <button class="btn" id="btnDoff" style="margin-top:0"></button>
      </div>
      <div class="hint" id="doffAtNote" style="margin:8px 0 0"></div>
      <div class="rows" style="margin-top:12px">
        <div id="t_obc"></div><div class="num" id="vObc">–</div>
        <div id="t_nwDoff"></div><div class="num" id="vNwDoff">–</div>
        <div id="t_kgNw"></div><div class="num" id="vKgNw">–</div>
        <div id="t_cycTh"></div><div class="num" id="vCycTh">–</div>
        <div id="t_cycRe"></div><div class="num" id="vCycRe">–</div>
        <div id="t_dwDoff"></div><div class="num" id="vDwDoff">–</div>
      </div>
    </div>
  </section>

  <section>
    <h2 id="t_zryw"></h2>
    <div class="pad">
      <div class="cnt" id="launchRow"><div class="pc" id="t_launched"></div>
        <button class="step" id="lMinus" aria-label="-1">−</button>
        <div class="v num" id="vLaunchSet">8</div>
        <button class="step" id="lPlus" aria-label="+1">+</button></div>
      <div class="hint" id="launchNote"></div>
      <div class="poz"><span id="t_pozZryw"></span><div class="pozRow" id="rowZryw"></div></div>
      <div class="poz"><span id="t_pozWlok"></span><div class="pozRow" id="rowWlok"></div></div>
      <div class="poz"><span id="t_pozBaran"></span><div class="pozRow" id="rowBaran"></div></div>
      <div class="rows">
        <div id="t_launchedRow"></div><div class="num" id="vLaunched">–</div>
        <div id="t_windPos"></div><div class="num" id="vWindPos">–</div>
        <div id="t_zrywCycle"></div><div class="num" id="vZrywCycle">0</div>
        <div id="t_effPos"></div><div class="num" id="vEffPos">–</div>
        <div id="t_zrywShift"></div><div class="num" id="vZrywShift">0</div>
        <div id="t_wlokShift"></div><div class="num" id="vWlokShift">0</div>
      </div>
      <div class="flag n" id="zrywFlag" hidden></div>
      <div class="hint" id="gradeNote"></div>
    </div>
  </section>

  <section>
    <h2 id="t_out"></h2>
    <div class="pad">
      <div class="rows">
        <div id="t_feed"></div><div class="num" id="vFeed">–</div>

const HOUR=3600000, SHIFT_H=12;

/* ---------- archiwum raportów zmianowych ----------
   Trzymane w osobnych kluczach po miesiącach, żeby zapis jednej zmiany nie przepisywał
   całego roku. Starsze niż 13 miesięcy kasujemy przy każdym przewinięciu zmiany. */
const ymOf=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};

/* ---------- baza raportow ----------
   localStorage ma okolo 5 MB na caly origin i trzyma wszystko jako tekst — rok raportow
   z dziennikiem juz sie tam ledwo miescil. Archiwum idzie wiec do IndexedDB: to prawdziwa
   baza w telefonie, liczona w setkach megabajtow, z indeksami i bez przepisywania calosci
   przy kazdym zapisie. Biezacy stan maszyn zostaje w localStorage — jest maly i czytany
   synchronicznie przy starcie. Gdyby IndexedDB nie bylo, wszystko wraca na stary tor. */
const IDB=(function(){
  var dbp=null, ok=(typeof indexedDB!=="undefined");
  function open(){
    if(dbp)return dbp;
    dbp=new Promise(function(res,rej){
      var r=indexedDB.open("ekstruzja",1);
      r.onupgradeneeded=function(e){var d=e.target.result;
        if(!d.objectStoreNames.contains("shifts")){
          var st=d.createObjectStore("shifts",{keyPath:"k"});
          st.createIndex("ym","ym",{unique:false});
          st.createIndex("t","t",{unique:false});}};
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){rej(r.error);};});
    return dbp;}
  function tx(mode,fn){return open().then(function(d){return new Promise(function(res,rej){
    var t=d.transaction("shifts",mode),st=t.objectStore("shifts"),req=fn(st);
    t.oncomplete=function(){res(req&&"result" in req?req.result:req);};
    t.onerror=function(){rej(t.error);};});});}
  return{ok:ok,
    put:function(r){return tx("readwrite",function(st){return st.put(r);});},
    byMonth:function(ym){return tx("readonly",function(st){return st.index("ym").getAll(ym);});},
    all:function(){return tx("readonly",function(st){return st.getAll();});},
    count:function(){return tx("readonly",function(st){return st.count();});},
    delBefore:function(ts){return tx("readwrite",function(st){
      var c=st.index("t").openCursor(IDBKeyRange.upperBound(ts));
      c.onsuccess=function(e){var cur=e.target.result;if(cur){cur.delete();cur.continue();}};
      return null;});}};})();

var HCOUNT=0, HISTM=[], DBUSE="–", DBPERS=false;
function dbStat(){
  if(navigator.storage&&navigator.storage.estimate)
    navigator.storage.estimate().then(function(e){
      var mb=function(b){return (b/1048576).toFixed(b>10485760?0:1)+" MB";};
      DBUSE=mb(e.usage||0)+" / "+mb(e.quota||0);});
  if(navigator.storage&&navigator.storage.persisted)
    navigator.storage.persisted().then(function(v){DBPERS=!!v;});}
setInterval(dbStat,60000);dbStat();
const HIST={
  ok:IDB.ok,
  push:function(rec){
    rec.k=rec.t+"_"+rec.m;rec.ym=ymOf(rec.t);
    if(IDB.ok)return IDB.put(rec).then(function(){HCOUNT++;}).catch(function(){lsPush(rec);});
    lsPush(rec);return Promise.resolve();},
  byMonth:function(ym){
    if(IDB.ok)return IDB.byMonth(ym).catch(function(){return lsLoad(ym);});
    return Promise.resolve(lsLoad(ym));},
  all:function(){
    if(IDB.ok)return IDB.all().catch(function(){return lsAll();});
    return Promise.resolve(lsAll());},
  months:function(){
    return this.all().then(function(a){
      var m={};a.forEach(function(r){m[r.ym||ymOf(r.t)]=1;});
      return Object.keys(m).sort().reverse();});},
  prune:function(){
    var cut=new Date();cut.setMonth(cut.getMonth()-13);
    if(IDB.ok)IDB.delBefore(cut.getTime()).catch(function(){});},
  refresh:function(){
    var self=this;
    return this.all().then(function(a){HCOUNT=a.length;
      var m={};a.forEach(function(r){m[r.ym||ymOf(r.t)]=1;});
      HISTM=Object.keys(m).sort().reverse();return a;}).catch(function(){return[];});}};

/* zapasowy tor na localStorage — uzywany tylko wtedy, gdy IndexedDB zawiedzie */
const HK=function(ym){return "ex3_h_"+ym;};
function lsLoad(ym){try{return JSON.parse(store.get(HK(ym))||"[]");}catch(e){return[];}}
function lsPush(rec){var ym=rec.ym||ymOf(rec.t),a=lsLoad(ym);
  if(a.some(function(x){return x.t===rec.t&&x.m===rec.m;}))return;
  a.push(rec);try{store.set(HK(ym),JSON.stringify(a));}catch(e){}}
function lsAll(){var out=[],now=new Date();
  for(var i=0;i<14;i++){var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    out=out.concat(lsLoad(ymOf(d.getTime())));}
  return out;}

/* jednorazowe przeniesienie tego, co juz lezy w localStorage */
function histMigrate(){
  if(!IDB.ok||store.get("ex3_h_moved")==="1")return Promise.resolve();
  var old=lsAll();
  if(!old.length){store.set("ex3_h_moved","1");return Promise.resolve();}
  return Promise.all(old.map(function(r){
    r.k=r.t+"_"+r.m;r.ym=r.ym||ymOf(r.t);return IDB.put(r);}))
    .then(function(){var now=new Date();
      for(var i=0;i<14;i++){var d=new Date(now.getFullYear(),now.getMonth()-i,1);
        store.set(HK(ymOf(d.getTime())),"[]");}
      store.set("ex3_h_moved","1");})
    .catch(function(){});}

/* zamknięcie zmiany: zapisujemy to, co faktycznie zdjęto, a nie prognozy */
function closeShift(id){const d=db[id],start=parseInt(d.shKey,10);
  if(!start||isNaN(start))return;
  const tally=gN(d.shift)+d.utyl.n+d.zrywShift+d.wlokShift+(d.dwShift||0)+(d.odpShift||0);
  if(!tally)return;                                    /* pusta zmiana — nie zaśmiecamy */
  const straty=kghOne(id)*(d.odpShift||0)/HOUR+perPos(id)*(d.zrywPosMs||0)/HOUR;
  HIST.push({t:start,n:new Date(start).getHours()===((d.cfg.sh+12)%24)?1:0,
    m:id,o:d.ord.nr||"",lot:d.ord.lot||"",ob:d.shiftDoffs||0,
    a1:[d.shift.a1.n,+d.shift.a1.kg.toFixed(2)],
    a2:[d.shift.a2.n,+d.shift.a2.kg.toFixed(2)],
    b:[d.shift.b.n,+d.shift.b.kg.toFixed(2)],
    c:[d.shift.c.n,+d.shift.c.kg.toFixed(2)],
    u:[d.utyl.n,+d.utyl.kg.toFixed(2)],
    z:d.zrywShift||0,w:d.wlokShift||0,
    odp:Math.round((d.odpShift||0)/60000),kon:Math.round((d.konShift||0)/60000),
    stp:Math.round(Math.max(0,(d.dwShift||0)-(d.odpShift||0))/60000),
    str:+(straty+(d.utyl?d.utyl.kg:0)+(d.shift.c?d.shift.c.kg:0)).toFixed(2),
    jr:(d.journal||[]).map(function(e){
      const o={m:Math.round((e.t-start)/60000),k:e.k};
      if(e.p)o.p=e.p; if(e.n!=null)o.n=e.n; if(e.d)o.d=e.d;
      if(e.g)o.g=GC.map(function(x){return [e.g[x].n,+e.g[x].kg.toFixed(2)];});
      return o;})});}

/* ---------- shifts ---------- */
function bounds(id,now){const d=db[id],a=d.cfg.sh,b=(a+12)%24,x=new Date(now),o=[];
  for(let k=-1;k<=1;k++)for(const h of[a,b])o.push(new Date(x.getFullYear(),x.getMonth(),x.getDate()+k,h,0,0,0).getTime());
  o.sort((p,q)=>p-q);let st=o[0];for(const v of o)if(v<=now)st=v;
  return{start:st,end:st+SHIFT_H*HOUR,night:new Date(st).getHours()===b};}
function rollShift(){const now=Date.now();
  LINES.forEach(l=>{const d=db[l.id],sb=bounds(l.id,now),key=String(sb.start);
    if(d.shKey!==key){
      if(d.shKey)closeShift(l.id);                     /* archiwum przed zerowaniem */
      d.shKey=key;d.dwShift=0;d.odpShift=0;d.konShift=0;d.zrywShift=0;d.wlokShift=0;d.shiftDoffs=0;d.firstDoff=0;
      d.labSet=null;d.shift=mkG();d.shB={zryw:0,wlok:0};d.events=[];d.utyl={n:0,kg:0};
      d.zrywPosMs=0;d.zrywSince=now;d.journal=[];
      d.zrywPos=[];d.zrywCycPos=[];d.wlokPos=[];d.baranPos=[];d.zrywKgPos={};}});
  if(Math.random()<0.02)HIST.prune();}
/* obciąg trafia do laboratorium rano po nocce, a lab nie pracuje w sobotę i niedzielę,
   więc oddajemy w noce zaczynające się w niedzielę, poniedziałek, wtorek, środę i czwartek */
function labAuto(id){const sb=bounds(id,Date.now());if(!sb.night)return false;
  const w=new Date(sb.start).getDay();return w<=4;}
const labOn=id=>db[id].labSet===null?labAuto(id):!!db[id].labSet;

/* ---------- dziennik zmiany ----------
   Każde zdarzenie ma godzinę. Stany (postój, awaria, odpad, próba) dostają czas trwania
   dopiero w chwili zakończenia, czyli przy następnej zmianie stanu. */
const STATEK=["odpad","awaria","stop","proba","koniec","rozruch"];
function jrnAt(id,ts,k,o){const d=db[id];
  if(!Array.isArray(d.journal))d.journal=[];
  d.journal.push(Object.assign({t:ts,k:k},o||{}));
  d.journal.sort(function(a,b){return a.t-b.t;});
  if(d.journal.length>300)d.journal=d.journal.slice(-300);}
function jrn(id,k,o){const d=db[id];
  if(!Array.isArray(d.journal))d.journal=[];
  d.journal.push(Object.assign({t:Date.now(),k:k},o||{}));
  if(d.journal.length>300)d.journal=d.journal.slice(-300);}
function jrnClose(id){const d=db[id];if(!Array.isArray(d.journal))return;
  for(let i=d.journal.length-1;i>=0;i--){const e=d.journal[i];
    if(STATEK.indexOf(e.k)>=0&&e.d==null){e.d=Date.now()-e.t;return;}}}
/* liczniki trzymamy zsynchronizowane z listami pozycji */
function syncZ(id){const d=db[id];
  d.zrywPos=d.zrywPos||[];d.zrywCycPos=d.zrywCycPos||[];d.wlokPos=d.wlokPos||[];
  d.baranPos=d.baranPos||[];
  d.zryw=d.zrywPos.length;d.zrywCycle=d.zrywCycPos.length;d.wlok=d.wlokPos.length;
  d.zrywPkg=d.zrywCycPos.map(function(x){return +(d.zrywKgPos[x]||0);});
  d.zrywKg=+d.zrywPkg.reduce(function(a,b){return a+b;},0).toFixed(2);}
LINES.forEach(function(l){syncZ(l.id);});

/* ---------- rates ---------- */
function kghOne(id){const o=db[id].ord,k=o.kgh||0;return(L_(id).pair&&o.pairKgh)?k/2:k;}
/* Dwa różne liczniki, bo to dwie różne rzeczy:
   zryw       — pozycje, które TERAZ nie nawijają; maszyna kręci np. 7 z 8, ich nitka leci w odpad.
   zrywCycle  — pozycje, które w tym cyklu miały zryw; po przewleczeniu znów nawijają,
                ale ich nawoje są lżejsze i idą na B przy najbliższej podmianie. */
/* launched — ile pozycji faktycznie ruszyło po przewleczeniu; zwykle wszystkie, ale nie zawsze */
const LAUNCH=id=>Math.min(POS(id),Math.max(0,db[id].launched||POS(id)));
const windPos=id=>Math.max(0,LAUNCH(id)-(db[id].zryw||0));       /* liczy się do tempa */
const cleanPos=id=>Math.max(0,LAUNCH(id)-(db[id].zrywCycle||0)); /* liczy się do wagi */
const deadPos=id=>Math.max(0,POS(id)-windPos(id));               /* wszystko, co leci w odpad */
const effPos=id=>cleanPos(id);
const perPos=id=>kghOne(id)/POS(id);
const kghEff=id=>perPos(id)*windPos(id);
/* Panel maszyny podaje czas nawijania wprost. Jesli operator go wpisze, liczymy z niego,
   bo to pomiar, a nie iloczyn dwoch recznie wpisanych liczb. */
const cycleCalc=id=>{const p=perPos(id);return p>0?db[id].cfg.kgNet/p:0;};
const cycleTh=id=>{const m=db[id].cfg.cycMin||0;return m>0?m/60:cycleCalc(id);};
const LT=e=>typeof e==="number"?e:e.t, LD=e=>typeof e==="number"?0:(e.d||0);
const RUNS=["run","proba"];                 /* nawija na nawoje */
/* Ponizej tego progu zaczety nawoj zwykle nie nadaje sie do niczego — pytamy operatora. */
const PROG_ODPAD=0.5;
/* Prog handlowy A1/A2 — domyslnie 3 kg, niezaleznie od masy nominalnej nawoju. */
const progA1=id=>{const v=db[id].cfg.progA1;return (isFinite(v)&&v>0)?v:3;};
/* koniec — zlecenie skończone, nowego jeszcze nie ma; maszyna stoi, ale nic nie leci w odpad,
   więc liczy się osobno od postoju technicznego */
/* Kazdy stan, w ktorym ekstruder podaje, a nic sie nie nawija, karmi ten sam odpad:
   rozruch (start zlecenia), stop, przewlekanie po zrywie i awaria.
   Koniec produkcji to jedyny stan z wylaczonym ekstruderem — tam odpad nie leci. */
const WASTE=["odpad","awaria","stop","rozruch"];
const paused=id=>!RUNS.includes(db[id].state);
const counts=id=>db[id].state==="run";      /* próba nie wchodzi do produkcji */
const sinceState=id=>paused(id)?Date.now()-db[id].stateSince:0;
const downNow=id=>db[id].dwDoff+sinceState(id);
const downShift=id=>db[id].dwShift+sinceState(id);
const odpadMs=id=>db[id].odpShift+(WASTE.includes(db[id].state)?Date.now()-db[id].stateSince:0);
/* zamykamy bieżący odcinek "ile pozycji stało i jak długo" */
function flushZryw(id){const d=db[id],n=Date.now(),k=deadPos(id);
  if(RUNS.includes(d.state)&&k>0)d.zrywPosMs+=k*(n-d.zrywSince);
  d.zrywSince=n;}
function zrywPosMsNow(id){const d=db[id],k=deadPos(id);
  return d.zrywPosMs+((RUNS.includes(d.state)&&k>0)?k*(Date.now()-d.zrywSince):0);}
/* Bilans kilogramów. Ekstruder podaje tyle samo niezależnie od zrywów — zmienia się tylko to,
   ile z tego ląduje na nawojach. Reszta jest fizycznie stracona i NIE liczy się do zlecenia,
   więc te kilogramy trzeba domotać: zlecenie trwa dłużej. */
const odpadKg=id=>kghOne(id)*odpadMs(id)/HOUR + perPos(id)*zrywPosMsNow(id)/HOUR;
/* Wszystko, co nie stalo sie produkcja, to odpad: nitka z przestojow i ze stojacych pozycji,
   obciag 0 i proba, oraz nawoje odlozone jako C. Jedna liczba zamiast czterech nazw.
   Litera C zostaje tylko jako oznaczenie odpadu w dzienniku i w raporcie. */
/* Czas czekania na zlecenie — liczony osobno od postoju technicznego. */
const konMs=id=>(db[id].konShift||0)+(db[id].state==="koniec"?Date.now()-db[id].stateSince:0);
function odpadAll(id){const d=db[id];
  return odpadKg(id)+(d.utyl?d.utyl.kg:0)+((d.shift&&d.shift.c)?d.shift.c.kg:0);}
function odpadParts(id){const d=db[id];
  return{czas:odpadKg(id),obc0:d.utyl?d.utyl.kg:0,c:(d.shift&&d.shift.c)?d.shift.c.kg:0};}
const feedKgh=id=>kghOne(id);                       /* podaż z ekstrudera — stała */
const windKgh=id=>perPos(id)*windPos(id);           /* realnie nawijane na nawoje */
const lossKgh=id=>feedKgh(id)-(paused(id)?0:windKgh(id));
function balance(id){const d=db[id],now=Date.now(),sb=bounds(id,now);
  const elapsed=Math.max(0,Math.min(SHIFT_H*HOUR,now-sb.start));
  const stopMs=Math.max(0,downShift(id)-odpadMs(id));   /* postój: ekstruder nie podaje */
  const fed=feedKgh(id)*Math.max(0,elapsed-stopMs)/HOUR;
  const lost=Math.min(fed,odpadKg(id));
  return{fed,lost,wound:Math.max(0,fed-lost),elapsed,stopMs};}
function cycleRe(id){const L=db[id].log;if(L.length<2)return 0;
  const n=Math.min(L.length-1,6),a=L.slice(-n-1);let s=0,k=0;
  for(let i=1;i<a.length;i++){const g=LT(a[i])-LT(a[i-1])-LD(a[i]);if(g>0){s+=g;k++;}}
  return k?s/k/HOUR:0;}
const kghRe=id=>{const c=cycleRe(id);return c>0?db[id].cfg.kgNet*POS(id)/c:0;};

/* prędkość nawijania pozwala sprawdzić, czy wydajność i masa nawoju trzymają się kupy */
const dtexCalc=id=>{const sp=db[id].spd||0;return sp>0?perPos(id)*1e7/(sp*60):0;};

/* ---------- handover ---------- */
/* Rozbicie tego, co wisi na maszynie: pozycje czyste dokręcą się do A1,
   włókienko dokręci się do pełnej wagi, ale pójdzie na B, a zerwane stoją na zamrożonej wadze. */
function handover(id){const d=db[id],cyc=cycleTh(id)*HOUR,now=Date.now(),zk=d.zrywKg||0;
  const zc=d.zrywCycle||0,wl=d.wlok||0,a1n=Math.max(0,LAUNCH(id)-zc-wl);
  if(cyc<=0)return{one:0,a1n,a1kg:0,wn:wl,wkg:0,zn:zc,zkg:zk,kgNow:zk,kgEnd:zk,doffs:0,nw:0};
  const dw=downNow(id);
  const fr=Math.min(1,Math.max(0,now-d.doffStart-dw)/cyc);
  const one=fr*d.cfg.kgNet;                       /* kg na jednej nawijającej pozycji */
  const runEnd=Math.max(0,bounds(id,now).end-d.doffStart-dw);
  const doffs=Math.floor(runEnd/cyc);
  const frEnd=(runEnd-doffs*cyc)/cyc;
  return{one,a1n,a1kg:a1n*one,wn:wl,wkg:wl*one,zn:zc,zkg:zk,
    kgNow:(a1n+wl)*one+zk,kgEnd:frEnd*d.cfg.kgNet*effPos(id)+zk,doffs,nw:doffs*POS(id)};}

/* ---------- pallets ---------- */
function palPlan(){const out={};
  G.forEach(g=>{
    const rows=LINES.map(l=>{const d=db[l.id];
      const lab=(labOn(l.id)&&LABG===g)?POS(l.id):0;
      return{id:l.id,name:l.name,norm:PAL(l.id),n:d.stock[g].n,lab,eff:Math.max(0,d.stock[g].n-lab)};});
    const total=rows.reduce((s,r)=>s+r.eff,0);
    const full=rows.filter(r=>r.eff>=r.norm);
    let act=null;
    if(full.length)act={t:"pack",rows:full};
    else{const half=rows.filter(r=>r.eff>r.norm/2);
      if(half.length){const tg=rows.slice().sort((a,b)=>b.eff-a.eff)[0];
        act= total>=tg.norm ? {t:"merge",tg,total} : {t:"short",tg,total,x:tg.norm-total};}}
    out[g]={rows,total,act};});
  return out;}

const hms=ms=>{ms=Math.max(0,Math.round(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;
  return[h,m,s].map(x=>String(x).padStart(2,"0")).join(":");};
const hm=ms=>{ms=Math.max(0,Math.round(ms/60000));const h=Math.floor(ms/60),m=ms%60;return(h?h+" h ":"")+m+" min";};
const dhm=ms=>{ms=Math.abs(ms);const d=Math.floor(ms/86400000),h=Math.round(ms%86400000/HOUR);return(d?d+" "+t("d")+" ":"")+h+" h";};

/* Etykieta palety ma QR z pieciu pol rozdzielonych srednikiem:
   ID;INDEKS;LOT;WAGA NETTO;ILOSC. Bloczek ma tylko numer zlecenia. */
function parseScan(v){v=String(v||"").trim();if(!v)return null;
  const p=v.split(";");
  if(p.length>=5){
    const kg=parseFloat(String(p[3]).replace(",",".")),n=parseInt(p[4],10);
    if(isFinite(kg)&&kg>0&&isFinite(n)&&n>0)
      return{type:"pal",id:p[0].trim(),idx:p[1].trim(),lot:p[2].trim(),kg:kg,n:n};}
  if(/^\d{6,}$/.test(v))return{type:"ord",nr:v};
  return{type:"raw",v:v};}

function applyScan(r){const d=S();
  if(r.type==="ord"){d.ord.nr=r.nr;const p=L_(cur).pair;if(p)db[p].ord.nr=r.nr;
    save();loadInputs();paint();buildDrawer();toast(t("scanOk",{n:r.nr}));return;}
  if(r.type==="pal"){
    d.ord.palIds=d.ord.palIds||[];
    if(r.id&&d.ord.palIds.indexOf(r.id)>=0){toast(t("scanDup"));return;}
    const per=r.kg/r.n;
    /* paleta jest z jednego gatunku — zdejmujemy ja z magazynu, inaczej sztuki zostaja podwojnie */
    let gg="a1",best=-1;
    G.forEach(function(g){const v=d.stock[g].n;if(v>=r.n&&v>best){best=v;gg=g;}});
    if(best<0){G.forEach(function(g){if(d.stock[g].n>best){best=d.stock[g].n;gg=g;}});}
    if(!confirm(t("scanPal",{n:r.n,kg:n1(r.kg),lot:r.lot,per:n1(per),
      cur:n1(d.cfg.kgNet),g:GN[gg],have:d.stock[gg].n})))return;
    if(!d.ord.idx)d.ord.idx=r.idx;
    if(!d.ord.lot)d.ord.lot=r.lot;
    if(r.id)d.ord.palIds.push(r.id);
    const take=Math.min(r.n,d.stock[gg].n);
    const takeKg=d.stock[gg].n?+(d.stock[gg].kg*take/d.stock[gg].n).toFixed(2):0;
    d.stock[gg].n-=take;d.stock[gg].kg=+(d.stock[gg].kg-takeKg).toFixed(2);
    packPush(r.kg,false,{g:gg,n:take,kg:takeKg});
    d.ord.packKg=+((d.ord.packKg||0)+r.kg).toFixed(2);
    save();loadInputs();paint();buildDrawer();toast(t("scanPalOk",{kg:n1(r.kg)}));return;}
  toast(t("scanNone"));}

$("scanFile").onchange=async()=>{
  const f=$("scanFile").files&&$("scanFile").files[0];if(!f)return;
  try{
    const det=new BarcodeDetector({formats:["qr_code","code_128","code_39","ean_13","itf","codabar"]});
    const bmp=await createImageBitmap(f);
    const codes=await det.detect(bmp);
    if(!codes.length){toast(t("scanNone"));return;}
    /* na etykiecie sa dwa kody — bierzemy ten bogatszy */
    let best=null;
    codes.forEach(function(c){const r=parseScan(c.rawValue);
      if(!r)return;
      if(!best||(r.type==="pal"&&best.type!=="pal"))best=r;});
    if(!best){toast(t("scanNone"));return;}
    applyScan(best);
  }catch(e){toast(t("scanNone"));}};

    prev:set?ordScope().map(id=>[id,db[id].ord.packKg||0]):null});

function openDP(at){const d=S(),kn=d.cfg.kgNet;DPAT=at||Date.now();

/* Maszyna podmienia sama o wyznaczonej godzinie, wiec aplikacja tez zapisuje podmiane sama.
   Gatunek wynika z czasu nawijania: pelny cykl daje pelna wage czyli A1, krotszy — A2.
   Pozycje oznaczone jako zryw, wlokienko albo baran ida na B niezaleznie od wagi. */
function faultPos(id){const d=db[id],bs=(d.baranPos||[]),all=(d.zrywCycPos||[]);
  return{z:all.filter(function(p){return bs.indexOf(p)<0;}),
         b:all.filter(function(p){return bs.indexOf(p)>=0;}),
         all:all,w:(d.wlokPos||[]).slice()};}
function registerDoff(id,ts,how){
  const d=db[id],c=cycMs(id),kn=d.cfg.kgNet;
  if(c<=0)return false;
  const net=Math.max(0,ts-d.doffStart-downNow(id));
  const frac=Math.min(1,net/c);
  const wOne=+(frac*kn).toFixed(3);
  const f=faultPos(id),bad=f.all.length+f.w.length;   /* baran juz w f.all */
  const good=Math.max(0,LAUNCH(id)-bad);
  const add=mkG();
  /* Gatunek zalezy od progu handlowego, nie od masy nominalnej: nawoj bez wad
     powyzej progu jest A1, nawet jesli nie doszedl do pelnej wagi. */
  const prog=progA1(id);
  if(wOne>=prog-0.001){add.a1.n=good;add.a1.kg=+(good*wOne).toFixed(2);}
  else{add.a2.n=good;add.a2.kg=+(good*wOne).toFixed(2);}
  add.b.n=bad;
  add.b.kg=+(f.all.reduce(function(a,p){return a+(d.zrywKgPos[p]||wOne);},0)
            +f.w.length*wOne).toFixed(2);   /* zerwane stoja na zamrozonej wadze */
  const parts=[];
  if(f.z.length)parts.push(t("jZryw",{p:f.z.join(", ")}));
  if(f.w.length)parts.push(t("jWlok",{p:f.w.join(", ")}));
  if(f.b.length)parts.push(t("jBaran",{p:f.b.join(", ")}));
  const scrap=(d.obciag===0)||(d.state==="proba");
  if(roleOff()&&how==="auto"){       /* mnie nie ma — numer leci dalej, danych nie zmyslamy */
    jrnAt(id,ts,"obcOff",{n:d.obciag});
    d.obciag=(d.obciag||0)+1;d.shiftDoffs=(d.shiftDoffs||0)+1;
    d.log.push({t:ts,d:downNow(id)});if(d.log.length>24)d.log=d.log.slice(-24);
    d.doffStart=ts;d.dwDoff=0;
    d.zrywPos=[];d.zrywCycPos=[];d.wlokPos=[];d.baranPos=[];d.zrywKgPos={};
    d.launched=POS(id);syncZ(id);return true;}
  const desc=(parts.length?parts.join("; "):t("jPodm"))+
    " · "+n1(wOne)+" kg/szt · "+hm(net)+(how==="man"?" · "+t("jManual"):"")+
    (scrap?" → "+t("utyl"):"");
  if(scrap){d.utyl.n+=good+bad;d.utyl.kg+=add.a1.kg+add.a2.kg+add.b.kg;}
  else{G.forEach(function(g){d.stock[g].n+=add[g].n;d.stock[g].kg+=add[g].kg;
                             d.shift[g].n+=add[g].n;d.shift[g].kg+=add[g].kg;});
       d.shB.zryw+=f.all.length;d.shB.wlok+=f.w.length;}
  jrnAt(id,ts,"obc",{n:d.obciag,g:add,a:desc,w:wOne,how:how,s:scrap});
  d.obciag=(d.obciag||0)+1;d.shiftDoffs=(d.shiftDoffs||0)+1;
  d.log.push({t:ts,d:downNow(id)});if(d.log.length>24)d.log=d.log.slice(-24);
  d.doffStart=ts;d.dwDoff=0;
  d.zrywPos=[];d.zrywCycPos=[];d.wlokPos=[];d.baranPos=[];d.zrywKgPos={};
  d.launched=POS(id);d.notifDoff=0;d.notifPal=0;syncZ(id);
  return true;}

/* Przy podejrzanie krotkim cyklu automat nie rusza, zeby bledna liczba
   nie wygenerowala dziesiatek wpisow. */
function autoDoffs(){const now=Date.now();let any=false;
  LINES.forEach(function(l){const d=db[l.id];
    if(d.autoDoff===false||RUNS.indexOf(d.state)<0)return;
    let c=cycMs(l.id),g=0;
    if(c<20*60000)return;
    while(g++<24){
      const due=d.doffStart+c+downNow(l.id)+(d.cfg.tAdj||0)*60000;
      if(due>now)break;
      if(!registerDoff(l.id,due,"auto"))break;
      any=true;c=cycMs(l.id);}});
  if(any)save();}

/* Maszyna podmienia sama o wyznaczonej godzinie. Puste pole = „nadrob wszystko do teraz”,
   wpisana godzina = ta jedna podmiana. Wczesniejsze zaliczamy jako pelne A1, bo nikt
   ich nie widzial — ostatnia operator opisuje recznie. */
function missedDoffs(id){const d=db[id],c=cycMs(id);
  if(c<=0)return[];
  const base=d.doffStart+downNow(id),now=Date.now(),out=[];
  let x=base+c;
  while(x<=now&&out.length<24){out.push(x);x+=c;}
  return out;}
$("btnDoff").onclick=()=>{
  const v=($("doffAt").value||"").trim();
  if(!v){
    if(!confirm(t("manAsk")))return;
    registerDoff(cur,Date.now(),"man");save();render();toast(t("manOk"));return;}
  if(v){const q=parseHM(v);
    if(!q){toast(t("hmBad"));return;}
    openDP(timeInShift(cur,q[0],q[1]).ts);return;}
  const miss=missedDoffs(cur);
  if(miss.length<=1){openDP(miss.length?miss[0]:Date.now());return;}
  if(!confirm(t("catchAsk",{n:miss.length,a:clk(miss[0]),b:clk(miss[miss.length-1])})))return;
  const d=S(),kn=d.cfg.kgNet;
  for(let i=0;i<miss.length-1;i++){
    const nn=LAUNCH(cur),scrap=(d.obciag===0)||(d.state==="proba");
    if(scrap){d.utyl.n+=nn;d.utyl.kg+=nn*kn;}
    else{d.stock.a1.n+=nn;d.stock.a1.kg+=nn*kn;
         d.shift.a1.n+=nn;d.shift.a1.kg+=nn*kn;}
    jrnAt(cur,miss[i],"obc",{n:d.obciag,a:"A1 "+nn+(scrap?" → utylizacja":"")});
    d.obciag=(d.obciag||0)+1;d.shiftDoffs=(d.shiftDoffs||0)+1;
    d.log.push({t:miss[i],d:0});}
  if(d.log.length>24)d.log=d.log.slice(-24);
  save();toast(t("catchOk",{n:miss.length-1}));
  openDP(miss[miss.length-1]);};
function setState(ns){const d=S(),n=Date.now();flushZryw(cur);
  if(RUNS.indexOf(d.state)<0){const dt=n-d.stateSince;   /* zamykamy poprzednią przerwę */
    d.dwDoff+=dt;d.dwShift+=dt;
    if(WASTE.indexOf(d.state)>=0)d.odpShift+=dt;         /* odpad i awaria */
    if(d.state==="koniec")d.konShift+=dt;}
  jrnClose(cur);                                  /* domykamy czas trwania poprzedniego stanu */
  d.state=ns;d.stateSince=n;
  jrn(cur,ns==="run"?"run":ns);
  d.events.push({t:n,s:ns});if(d.events.length>24)d.events=d.events.slice(-24);
  save();paint();buildDrawer();}

$("btnResume").onclick=()=>{const d=S(),from=d.state,now=Date.now();
  flushZryw(cur);d.zrywPos=[];syncZ(cur);
  if(from==="rozruch"||d.preProd){        /* pierwsza nawijarka po starcie zlecenia */
    d.preProd=false;d.obciag=0;d.doffStart=now;d.dwDoff=0;
    d.zrywCycPos=[];d.wlokPos=[];d.baranPos=[];d.zrywKgPos={};syncZ(cur);
    jrn(cur,"prod0");}
  else{
    /* Kazda przerwa w nawijaniu konczy obciag i zaczyna nastepny, z kolejnym numerem.
       Ponizej progu pytamy, czy resztka idzie w odpad — powyzej wchodzi do produkcji
       normalnie, z waga i gatunkiem policzonym z czasu nawijania. */
    const hv=handover(cur),one=hv.one,all=hv.kgNow;
    const nowy=function(){d.obciag=(d.obciag||0)+1;d.doffStart=now;d.dwDoff=0;
      d.zrywCycPos=[];d.wlokPos=[];d.baranPos=[];d.zrywKgPos={};syncZ(cur);};
    if(all>0.01){
      if(one<PROG_ODPAD&&confirm(t("scrapAsk",{w:n1(one),k:n1(all)}))){
        d.utyl.kg=+(d.utyl.kg+all).toFixed(2);
        jrn(cur,"lostLoad",{k:n1(all)});nowy();}
      else registerDoff(cur,now,"man");   /* liczy wage i gatunek, sam podnosi numer */
    }else nowy();
  }
  setState("run");};
/* „Puszczone pozycje" wracają przy podmianie na komplet (8 albo 6) — operator koryguje,
   jeśli faktycznie ruszyło mniej */
/* Pozycje zaznacza się dotknięciem — wiadomo, która się zerwała, a nie tylko ile ich było. */
function togglePoz(kind,pz){const d=S();
  /* baran to zryw nawiniety na wal — pozycja stoi, wiec idzie do tych samych list,
     a baranPos zapamietuje tylko, ze to byl baran, nie zwykly zryw */
  if(kind==="b"||kind==="z"){
    const isB=kind==="b",in0=d.zrywPos.indexOf(pz)>=0,wasB=(d.baranPos||[]).indexOf(pz)>=0;
    if(in0&&isB===wasB){                       /* to samo jeszcze raz = odwolanie */
      d.zrywPos.splice(d.zrywPos.indexOf(pz),1);
      const j=d.zrywCycPos.indexOf(pz);
      if(j>=0){d.zrywCycPos.splice(j,1);delete d.zrywKgPos[pz];}
      if(wasB)d.baranPos.splice(d.baranPos.indexOf(pz),1);
      d.zrywShift=Math.max(0,d.zrywShift-1);
      jrn(cur,isB?"baranOff":"zrywOff",{p:pz});
    }else{
      if(!in0){flushZryw(cur);d.zrywPos.push(pz);d.zrywPos.sort(function(a,b){return a-b;});
        if(d.zrywCycPos.indexOf(pz)<0){d.zrywCycPos.push(pz);d.zrywCycPos.sort(function(a,b){return a-b;});}
        d.zrywKgPos[pz]=+handover(cur).one.toFixed(2);
        d.zrywShift++;}
      d.baranPos=d.baranPos||[];
      const bi=d.baranPos.indexOf(pz);
      if(isB&&bi<0)d.baranPos.push(pz);
      if(!isB&&bi>=0)d.baranPos.splice(bi,1);
      jrn(cur,isB?"baran":"zryw",{p:pz});}
    syncZ(cur);save();paint();buildDrawer();return;}
  const arr=d.wlokPos;
  const i=arr.indexOf(pz);
  if(i>=0){arr.splice(i,1);
    if(kind==="z"){const j=d.zrywCycPos.indexOf(pz);
      if(j>=0){d.zrywCycPos.splice(j,1);delete d.zrywKgPos[pz];}
      d.zrywShift=Math.max(0,d.zrywShift-1);jrn(cur,"zrywOff",{p:pz});}
    else if(kind==="b")jrn(cur,"baranOff",{p:pz});
    else{d.wlokShift=Math.max(0,d.wlokShift-1);jrn(cur,"wlokOff",{p:pz});}}
  else{flushZryw(cur);arr.push(pz);arr.sort(function(a,b){return a-b;});
    if(kind==="z"){if(d.zrywCycPos.indexOf(pz)<0){d.zrywCycPos.push(pz);
        d.zrywCycPos.sort(function(a,b){return a-b;});}
      d.zrywKgPos[pz]=+handover(cur).one.toFixed(2);   /* waga nawoju zamraża się tutaj */
      d.zrywShift++;jrn(cur,"zryw",{p:pz});}
    else if(kind==="b")jrn(cur,"baran",{p:pz});
    else{d.wlokShift++;jrn(cur,"wlok",{p:pz});}}
  syncZ(cur);save();paint();buildDrawer();}

    b.className="pz";b.textContent=i;b.dataset.p=i;

/* ---------- powiadomienia ----------
   Alarm liczy wszystkie maszyny, nie tylko otwartą. Dźwięk i wibracja są zapasem
   na wypadek, gdy system nie przepuści powiadomienia. */
let NOTIF={on:store.get("ex3_notif")==="1",min:parseInt(store.get("ex3_notifmin")||"5",10)};
let AC=null;
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();
  [0,0.6].forEach(off=>{const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);o.type="square";o.frequency.value=880;
    const t0=AC.currentTime+off;
    g.gain.setValueAtTime(0.0001,t0);

function notify(title,body){

/* czy najbliższa podmiana domknie paletę któregoś gatunku */
function palletAfterDoff(id){const d=db[id],norm=PAL(id);
  if(d.obciag===0||d.state==="proba")return null;        /* ten obciąg idzie do utylizacji */
  const bAdd=(d.zrywCycle||0)+(d.wlok||0);
  const add={a1:Math.max(0,LAUNCH(id)-bAdd),a2:0,b:bAdd};
  for(const g of G){
    const lab=(labOn(id)&&LABG===g)?POS(id):0;
    const after=Math.max(0,d.stock[g].n+add[g]-lab);
    if(after>=norm)return{g:GN[g],n:after,norm};}
  return null;}

function nextDoffAt(id){const tg=doffTarget(id);return tg?tg.ts:0;}

function checkAlerts(){
  if(!NOTIF.on)return;
  const lead=NOTIF.min*60000,now=Date.now();let dirty=false;
  LINES.forEach(l=>{const d=db[l.id];
    if(!RUNS.includes(d.state))return;
    const next=nextDoffAt(l.id);if(!next)return;
    const left=next-now;
    if(left>0&&left<=lead&&d.notifDoff!==d.doffStart){
      d.notifDoff=d.doffStart;dirty=true;
      const pal=palletAfterDoff(l.id);
      notify(t("nDoff",{l:l.name,m:Math.max(1,Math.round(left/60000))}),
             pal?t("nPal",{g:pal.g,n:pal.n,norm:pal.norm}):"");}});
  if(dirty)save();}
setInterval(checkAlerts,15000);

/* ---------- edycja podmiany ----------
   Poprawka musi ruszyc magazyn i licznik zmiany o roznice, inaczej suma sie rozjedzie. */
let JEI=-1;
function jeApply(id,e,sign){const d=db[id];
  if(!e.g)return;
  if(e.s){d.utyl.n+=sign*G.reduce(function(a,g){return a+e.g[g].n;},0);
          d.utyl.kg=+(d.utyl.kg+sign*G.reduce(function(a,g){return a+e.g[g].kg;},0)).toFixed(2);return;}
  G.forEach(function(g){
    d.stock[g].n+=sign*e.g[g].n;d.stock[g].kg=+(d.stock[g].kg+sign*e.g[g].kg).toFixed(2);
    d.shift[g].n+=sign*e.g[g].n;d.shift[g].kg=+(d.shift[g].kg+sign*e.g[g].kg).toFixed(2);});}
function openJE(i){const d=S(),e=d.journal[i];if(!e||e.k!=="obc")return;
  JEI=i;

/* ---------- harmonogram podmian ----------
   Każda nawijarka liczy się osobno. E1 podaje nitkę do N1A i N1B, ale nawijają niezależnie:
   zryw na N1A nie zatrzymuje N1B, więc godziny podmian się rozjeżdżają. */
function cycMs(id){const r=cycleRe(id);return (r>0?r:cycleTh(id))*HOUR;}
/* Jesli godzina podmiany minela, a nikt nie nacisnal „Podmiana wykonana”, przeskakujemy
   na kolejna — ale przez GRACE minut pokazujemy jeszcze te, ktora wlasnie minela,
   zeby spoznienie bylo widoczne, a nie zniknelo w tej samej sekundzie. */
const GRACE=20*60000;
function doffTarget(id){const d=db[id],c=cycMs(id);
  if(c<=0)return null;
  const base=d.doffStart+downNow(id)+(d.cfg.tAdj||0)*60000,el=Date.now()-base;
  let n=Math.floor(el/c)+1; if(n<0)n=0;
  const next=base+n*c, prev=base+(n-1)*c;
  if(n>1&&Date.now()-prev<=GRACE)return{ts:prev,late:true,nr:n-1};
  return{ts:next,late:false,nr:n};}
function schedule(id,limit){const d=db[id],c=cycMs(id),tg=doffTarget(id);
  if(c<=0||!tg||!RUNS.includes(d.state))return[];
  const end=bounds(id,Date.now()).end,out=[];
  let t=tg.ts;
  while(t<=end&&out.length<(limit||12)){out.push(t);t+=c;}
  return out;}
/* Godzina wpisana ręcznie trafia w okno bieżącej zmiany, także tej przez północ.
   Bierzemy ten wariant doby, który wpada w zmianę; jeśli żaden nie wpada — najbliższy,
   ale mówimy o tym operatorowi zamiast po cichu przesuwać o dobę. */
function timeInShift(id,hh,mm){const sb=bounds(id,Date.now()),d0=new Date(sb.start);
  const base=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate(),hh,mm,0,0).getTime();
  let best=base,bd=Infinity;
  for(const off of[-1,0,1]){const c=base+off*86400000;
    const dist=c<sb.start?sb.start-c:(c>sb.end?c-sb.end:0);
    if(dist<bd){bd=dist;best=c;}}
  return{ts:best,inShift:bd===0};}

/* Godzinę wpisuje się z klawiatury — okno z zegarem w WebView jest wolne i się zamyka.
   Przyjmujemy 7, 720, 0720 albo 7:20. */
function parseHM(v){const d=String(v).replace(/\D/g,"");if(!d.length)return null;
  let hh,mm;
  if(d.length<=2){hh=+d;mm=0;}
  else if(d.length===3){hh=+d[0];mm=+d.slice(1);}
  else{hh=+d.slice(0,2);mm=+d.slice(2,4);}
  if(hh===24&&mm===0)hh=0;                 /* 2400 i 24 to polnoc, tak sie pisze w raportach */
  if(hh>23||mm>59)return null;return[hh,mm];}
const hm2=(h,m)=>String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
const STK={proba:"stProba",odpad:"stOdpad",awaria:"stAwaria",stop:"stopped",koniec:"stKoniec",rozruch:"stRozruch"};

    /* cykl krotszy niz 20 min albo dluzszy niz 12 h prawie na pewno oznacza zla liczbe */
    const cc=cycleCalc(l.id)*HOUR;

    else if(diff){u.info.innerHTML="<span style='color:var(--amber)'>"+

    else{const why=c<=0?t("noRate"):t("notRunning",{s:t(STK[d.state]||"run")});
      u.info.innerHTML="<span style='color:var(--dim)'>"+why+"</span><span></span>";}});}

/* ---------- raport zmianowy w ukladzie papierowego formularza ----------
   Wszystko liczymy z dziennika: godzinowe kilogramy na gatunek, numer zdjetego obciagu,
   uwagi i postoje z godzina start/stop. Jeden raport na jedna maszyne, jak na papierze. */
let OPNR=store.get("ex3_op")||"";
/* Gdzie stoje na zmianie. „Wolne" znaczy, ze mnie nie ma: obciagi licza sie dalej,
   ale nie wchodza do raportu — nikt nie zapisal ani sztuk, ani gatunkow. */
let ROLE=store.get("ex3_role")||"dol";
const roleOff=()=>ROLE==="wolne";
function jrEntries(rec){
  /* z archiwum albo z biezacej zmiany */
  if(rec.live)return (db[rec.m].journal||[]).map(function(e){return e;});
  return (rec.jr||[]).map(function(o){
    const e={t:rec.t+o.m*60000,k:o.k,p:o.p,n:o.n,d:o.d};
    if(o.g){e.g={};GC.forEach(function(x,i){e.g[x]={n:o.g[i][0],kg:o.g[i][1]};});}
    return e;});}

function hourly(start,entries){const rows=[];
  for(let h=0;h<12;h++){
    const from=start+h*HOUR,to=from+HOUR;
    const r={from:from,to:to,g:mkG(),obc:[],uw:[],ps:[]};
    entries.forEach(function(e){
      if(e.t<from||e.t>=to)return;
      if(e.k==="obc"){if(e.g)GC.forEach(function(x){r.g[x].n+=e.g[x].n;r.g[x].kg+=e.g[x].kg;});
        if(e.n!=null)r.obc.push(e.n);}
      else if(e.k==="zryw")r.uw.push(t("jZryw",{p:e.p}));
      else if(e.k==="wlok")r.uw.push(t("jWlok",{p:e.p}));
      else if(e.k==="noobc")r.uw.push(t("noDoff"));
      else if(e.k==="launch")r.uw.push(t("jLaunch",{n:e.n}));
      else if(e.k==="cyc")r.uw.push(t("jCyc",{n:e.n}));
      else if(e.k==="obcOff"){r.obc.push(e.n);r.uw.push(t("jObcOff",{n:e.n}));}
      else if(STATEK.indexOf(e.k)>=0)r.ps.push(e);});
    rows.push(r);}
  return rows;}

let RAPL=[];                       /* lista zmian do wyboru */
function rapList(){

    const m=$("rapMach").value||cur;

    const sb=bounds(m,Date.now());
    out.unshift({t:sb.start,m:m,live:true,n:sb.night?1:0});
    return out;});}

        " "+(r.n?t("hNight"):t("hDay"));ss.appendChild(o);});

function drawRap(rec){
  if(!rec){$("rapTable").innerHTML="";$("rapHead").innerHTML="";return;}
  const id=rec.m,d=db[id],kO=kghOne(id);
  const rows=hourly(rec.t,jrEntries(rec));
  const nm=L_(id).name.split(" ");
  $("rapHead").innerHTML=
    "<div class='rows'>"+
    "<div>"+t("rData")+"</div><div class='num'>"+new Date(rec.t).toLocaleDateString(loc())+"</div>"+
    "<div>"+t("rMasz")+"</div><div class='num'>"+nm[1]+" / "+nm[2]+"</div>"+
    "<div>"+t("rZmiana")+"</div><div class='num'>"+(rec.n?"N":"D")+" · "+clk(rec.t)+"–"+clk(rec.t+12*HOUR)+"</div>"+
    "<div>"+t("rOper")+"</div><div class='num'>"+(OPNR||"–")+"</div>"+
    "<div>"+t("roleRap")+"</div><div class='num'>"+
      t(ROLE==="gora"?"roleG":(ROLE==="wolne"?"roleO":"roleD"))+"</div>"+
    "<div>"+t("rTeorH")+"</div><div class='num'>"+(kO?n1(kO)+" kg":"–")+"</div>"+
    "<div>"+t("rTeorZm")+"</div><div class='num'>"+(kO?n1(kO*12)+" kg":"–")+"</div>"+
    "</div>";
  let h="<table class='rap'><tr><th>"+t("rGodz")+"</th>"+
    GC.map(function(g){return "<th>"+GN[g]+"</th>";}).join("")+
    "<th>"+t("rSuma")+"</th><th>"+t("rObc")+"</th><th>"+t("rUwagi")+"</th>"+
    "<th>"+t("rPstart")+"</th><th>"+t("rPstop")+"</th><th>"+t("rPowod")+"</th></tr>";
  const tot=mkG();let totOb=0;
  rows.forEach(function(r){
    const sum=G.reduce(function(a,g){return a+r.g[g].kg;},0);
    GC.forEach(function(g){tot[g].n+=r.g[g].n;tot[g].kg+=r.g[g].kg;});
    totOb+=r.obc.length;
    const ps=r.ps[0];
    h+="<tr><td class='h'>"+clk(r.from)+"–"+clk(r.to)+"</td>"+
      GC.map(function(g){return "<td>"+(r.g[g].kg?n1(r.g[g].kg):"")+"</td>";}).join("")+
      "<td>"+(sum?n1(sum):"")+"</td>"+
      "<td>"+(r.obc.length?r.obc.join(", "):"")+"</td>"+
      "<td class='l'>"+r.uw.join("; ")+"</td>"+
      "<td>"+(ps?clk(ps.t):"")+"</td>"+
      "<td>"+(ps&&ps.d?clk(ps.t+ps.d):"")+"</td>"+
      "<td class='l'>"+(ps?t(STK[ps.k]||ps.k):"")+"</td></tr>";});
  const tk=G.reduce(function(a,g){return a+tot[g].kg;},0);
  h+="<tr class='sum'><td>"+t("sum")+"</td>"+
    GC.map(function(g){return "<td>"+(tot[g].kg?n1(tot[g].kg):"")+"</td>";}).join("")+
    "<td>"+n1(tk)+"</td><td>"+totOb+"</td><td colspan='4'></td></tr></table>";
  $("rapTable").innerHTML=h;}

$("rapMach").onchange=paintRap;
$("rapShift").onchange=function(){drawRap(RAPL[+$("rapShift").value]);};
$("opNr").oninput=function(){OPNR=$("opNr").value.trim();store.set("ex3_op",OPNR);};
$("btnRapCsv").onclick=function(){
  const rec=RAPL[+$("rapShift").value];if(!rec){toast(t("csvNone"));return;}
  const rows=hourly(rec.t,jrEntries(rec));
  const head=[t("rGodz")].concat(GC.map(function(g){return GN[g];}))
    .concat([t("rSuma"),t("rObc"),t("rUwagi"),t("rPstart"),t("rPstop"),t("rPowod")]);
  const body=rows.map(function(r){const ps=r.ps[0];
    return [clk(r.from)+"-"+clk(r.to)].concat(GC.map(function(g){return r.g[g].kg?n1(r.g[g].kg):"";}))
      .concat([n1(G.reduce(function(a,g){return a+r.g[g].kg;},0)),r.obc.join(" "),
               r.uw.join("; "),ps?clk(ps.t):"",ps&&ps.d?clk(ps.t+ps.d):"",ps?t(STK[ps.k]||ps.k):""]);});
  download("raport-"+L_(rec.m).name.replace(/ /g,"")+"-"+
    new Date(rec.t).toISOString().slice(0,10)+".csv",
    [head.join(";")].concat(body.map(function(x){return x.join(";");})).join("\n"));};

/* ---------- raporty ---------- */
const CSVH=["Data","Zmiana","Maszyna","Zlecenie","Lot","Obciagi",
 "A1 szt","A1 kg","A2 szt","A2 kg","B szt","B kg","C szt","C kg","Obciąg 0 szt","Obciąg 0 kg",
 "Zrywy","Wlokienka","Odpad kg","Odpad min","Brak zlecenia min","Postoj min"];
const csvRow=r=>[new Date(r.t).toLocaleDateString("pl-PL"),r.n?"noc":"dzien",
  L_(r.m)?L_(r.m).name:r.m,r.o,r.lot||"",r.ob,
  r.a1[0],r.a1[1],r.a2[0],r.a2[1],r.b[0],r.b[1],(r.c||[0,0])[0],(r.c||[0,0])[1],r.u[0],r.u[1],
  r.z,r.w,r.str,r.odp,r.kon||0,r.stp];
function download(name,text){
  try{const b=new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8"});
    const u=URL.createObjectURL(b),a=document.createElement("a");
    a.href=u;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1000);
    toast(t("csvOk",{f:name}));}
  catch(e){prompt(name,text);}}
function toCsv(rows){
  return [CSVH.join(";")].concat(rows.map(r=>csvRow(r).join(";"))).join("\n");}
$("btnCsv").onclick=()=>{const ym=$("histMonth").value;
  HIST.byMonth(ym).then(rows=>{if(!rows.length){toast(t("csvNone"));return;}
    download("ekstruzja-"+ym+".csv",toCsv(rows.slice().sort((a,b)=>a.t-b.t)));});};
$("btnCsvAll").onclick=()=>{HIST.all().then(rows=>{
  if(!rows.length){toast(t("csvNone"));return;}
  download("ekstruzja-archiwum.csv",toCsv(rows.sort((a,b)=>a.t-b.t)));});};
$("histMonth").onchange=()=>paintHist(true);

function paintHist(keep){
  rollShift();
  $("hLine").textContent=t("histT");$("hSub").textContent="";
  HIST.refresh().then(function(){
    const sel=$("histMonth");
    if(!keep){const prev=sel.value;sel.innerHTML="";
      (HISTM.length?HISTM:[ymOf(Date.now())]).forEach(function(m){
        const o=document.createElement("option");o.value=m;o.textContent=m;sel.appendChild(o);});
      if(prev&&HISTM.indexOf(prev)>=0)sel.value=prev;}
    return HIST.byMonth(sel.value);
  }).then(function(r){renderHist(r.slice().sort(function(a,b){return b.t-a.t;}));})
   .catch(function(){renderHist([]);});
  paintRap();}

function renderHist(rows){
  const sum=rows.reduce((a,r)=>({ob:a.ob+r.ob,n:a.n+r.a1[0]+r.a2[0]+r.b[0],
    kg:a.kg+r.a1[1]+r.a2[1]+r.b[1],u:a.u+r.u[0],z:a.z+r.z,w:a.w+r.w,str:a.str+r.str}),
    {ob:0,n:0,kg:0,u:0,z:0,w:0,str:0});
  const per=rows.reduce(function(a,r){
    G.forEach(function(g){const v=r[g]||[0,0];a[g][0]+=v[0];a[g][1]+=v[1];});
    a.uk+=r.u[1];return a;},{a1:[0,0],a2:[0,0],b:[0,0],c:[0,0],uk:0});
  $("histTot").innerHTML=
    "<div>"+t("hObc")+"</div><div class='num'>"+sum.ob+"</div>"+
    G.map(function(g){return "<div>"+GN[g]+"</div><div class='num'>"+
      per[g][0]+" szt · "+n1(per[g][1])+" kg</div>";}).join("")+
    "<div>"+t("sum")+"</div><div class='num big'>"+sum.n+" szt · "+n1(sum.kg)+" kg</div>"+
    "<div>"+t("utyl")+"</div><div class='num'>"+sum.u+" szt · "+n1(per.uk)+" kg</div>"+
    "<div>"+t("zryw")+"</div><div class='num'>"+sum.z+" / "+sum.w+"</div>"+
    "<div>"+t("hStr")+"</div><div class='num'>"+n1(sum.str)+" kg</div>"+
    "<div>"+t("hKon")+"</div><div class='num'>"+(sum.kon?hm(sum.kon*60000):"–")+"</div>";
  /* to samo w rozbiciu na maszyny — jedna suma nie mówi, która linia ciągnie w dół */
  const mb=$("histMachBox");mb.innerHTML="";
  LINES.forEach(function(l){
    const rs=rows.filter(function(r){return r.m===l.id;});
    if(!rs.length)return;
    const p=rs.reduce(function(a,r){G.forEach(function(g){const v=r[g]||[0,0];
      a[g][0]+=v[0];a[g][1]+=v[1];});a.ob+=r.ob;a.u+=r.u[0];
      a.z+=r.z;a.w+=r.w;a.str+=r.str;return a;},
      {a1:[0,0],a2:[0,0],b:[0,0],c:[0,0],ob:0,u:0,z:0,w:0,str:0});
    const kg=G.reduce(function(x,g){return x+p[g][1];},0),
          szt=G.reduce(function(x,g){return x+p[g][0];},0);
    const c=document.createElement("div");c.className="mcard";
    c.innerHTML="<div class='mhead'><b>"+l.name+"</b><em>"+t("hObc")+" "+p.ob+" · "+
      rs.length+" zm.</em></div>"+
      G.map(function(g){return "<div class='log'><span>"+GN[g]+"</span><span>"+
        p[g][0]+" szt · "+n1(p[g][1])+" kg</span></div>";}).join("")+
      "<div class='log'><span><b>"+t("sum")+"</b></span><span><b>"+szt+" szt · "+n1(kg)+" kg</b></span></div>"+
      "<div class='log'><span>"+t("utyl")+" "+p.u+" · "+t("zryw")+" "+p.z+"/"+p.w+
      "</span><span>"+t("hStr")+" "+n1(p.str)+" kg</span></div>";
    mb.appendChild(c);});
  const box=$("histBox");box.innerHTML="";
  if(!rows.length){const e=document.createElement("div");e.className="pad";e.style.color="var(--dim)";
    e.textContent=t("histEmpty");box.appendChild(e);return;}
  rows.forEach(r=>{const c=document.createElement("div");c.className="mcard";
    const nm=L_(r.m)?L_(r.m).name:r.m;
    c.innerHTML="<div class='mhead'><b>"+new Date(r.t).toLocaleDateString(loc(),{day:"2-digit",month:"2-digit"})+
      " · "+(r.n?t("hNight"):t("hDay"))+"</b><em>"+nm+(r.o?" · "+r.o:"")+"</em></div>"+
      "<div class='log'><span>A1 "+r.a1[0]+" · A2 "+r.a2[0]+" · B "+r.b[0]+
      ((r.c||[0])[0]?" · C "+r.c[0]:"")+"</span><span>"+
      n1(r.a1[1]+r.a2[1]+r.b[1]+(r.c||[0,0])[1])+" kg</span></div>"+
      "<div class='log'><span>"+t("hObc")+" "+r.ob+" · "+t("zryw")+" "+r.z+"/"+r.w+
      (r.u[0]?" · "+t("utyl")+" "+r.u[0]:"")+"</span><span>"+t("hStr")+" "+n1(r.str)+" kg</span></div>";
    box.appendChild(c);});
}

function render(){
  $("viewLine").hidden=view!=="line";
  $("viewStock").hidden=view!=="stock";
  $("viewHist").hidden=view!=="hist";
  $("viewDoff").hidden=view!=="doffs";
  if(view==="line")paint();
  else if(view==="stock")paintStock();
  else if(view==="doffs")paintDoffs(true);
  else paintHist();
  buildDrawer();}
/* Prosimy Androida, zeby nie kasowal danych przy braku miejsca. Dla zainstalowanej
   aplikacji zgoda jest zwykle przyznawana automatycznie. */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
histMigrate().then(function(){return HIST.refresh();}).then(function(){buildDrawer();});
applyLang();loadInputs();render();
function tick(){autoDoffs();if(view==="line")paint();else if(view==="doffs")paintDoffs(false);else if(view==="stock")paintStock();}
setInterval(tick,1000);
/* Przy zgaszonym ekranie system wstrzymuje timer. Wszystko liczymy z zegara systemowego,
   wiec wystarczy przerysowac natychmiast po powrocie — bez czekania na kolejne tykniecie. */
["visibilitychange","focus","pageshow","resume"].forEach(function(ev){
  (ev==="visibilitychange"?document:window).addEventListener(ev,function(){
    if(!document.hidden)tick();});});
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("./sw.js").catch(()=>{});}
</script>
